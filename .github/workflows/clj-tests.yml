name: Clj tests
on: [push, pull_request]

jobs:
  tests:
    strategy:
      matrix:
        java: ['17', '19', '21']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: ${{ matrix.java }}
      - uses: DeLaGuardo/setup-clojure@13.6.0
        with:
          lein: 2.12.0 # Pinned 2026-06-11: `latest` (2.13.0) currently breaks setup-clojure's Windows lein.ps1 shim
      - uses: actions/cache@v5
        id: cache-deps
        with:
          path: ~/.m2/repository
          key: deps-${{ runner.os }}-${{ hashFiles('project.clj') }}
          restore-keys: |
            deps-${{ runner.os }}-
      - run: lein test-clj
